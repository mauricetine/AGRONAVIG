stages:
  - validate
  - test
  - build
  - deploy

variables:
  BACKEND_IMAGE: $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA
  FRONTEND_IMAGE: $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA

# Validation stage
validate-backend:
  stage: validate
  image: python:3.11-slim
  script:
    - cd agronavig-backend
    - echo "Vérification du Dockerfile..."
    - test -f Dockerfile || (echo "Dockerfile manquant"; exit 1)
    - test -f requirements.txt || (echo "requirements.txt manquant"; exit 1)
    - echo "✓ Backend validé"
  only:
    - main
    - master
    - develop

validate-frontend:
  stage: validate
  image: node:18-alpine
  script:
    - cd agronavig-frontend
    - echo "Vérification du Dockerfile..."
    - test -f Dockerfile || (echo "Dockerfile manquant"; exit 1)
    - test -f package.json || (echo "package.json manquant"; exit 1)
    - echo "✓ Frontend validé"
  only:
    - main
    - master
    - develop

# Test stage
test-backend:
  stage: test
  image: python:3.11-slim
  script:
    - cd agronavig-backend
    - echo "Installation des dépendances backend..."
    - pip install --no-cache-dir -r requirements.txt
    - echo "✓ Dépendances backend OK"
  only:
    - main
    - master
    - develop

test-frontend:
  stage: test
  image: node:18-alpine
  script:
    - cd agronavig-frontend
    - echo "Installation des dépendances frontend..."
    - npm ci
    - echo "✓ Dépendances frontend OK"
    - npm run lint || echo "Lint check skipped"
  only:
    - main
    - master
    - develop

# Build stage
build-frontend:
  stage: build
  image: node:18-alpine
  script:
    - cd agronavig-frontend
    - npm ci
    - echo "Compilation du frontend..."
    - npm run build
    - echo "✓ Frontend compilé"
  artifacts:
    paths:
      - agronavig-frontend/dist/
    expire_in: 1 hour
  only:
    - main
    - master

build-backend:
  stage: build
  image: python:3.11-slim
  script:
    - cd agronavig-backend
    - pip install --no-cache-dir -r requirements.txt
    - echo "✓ Backend validé"
  only:
    - main
    - master

# Deploy stage
deploy-production:
  stage: deploy
  image: alpine:latest
  script:
    - echo "Déploiement prêt (manuel)"
  environment:
    name: production
  only:
    - main
    - master
  when: manual
