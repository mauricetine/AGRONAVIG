version: '3.8'

services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=agronavig
    ports:
      - "5433:5432"

  redis:
    image: redis:alpine
    container_name: agronavig_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  backend:
    build: ./agronavig-backend
    container_name: agronavig_backend
    ports:
      - "8000:8000"
    volumes:
      - ./agronavig-backend:/app
      - agronavig_uploads:/app/uploads
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/agronavig
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    restart: always

  frontend:
    build: ./agronavig-frontend
    container_name: agronavig_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
  redis_data:
  agronavig_uploads:
