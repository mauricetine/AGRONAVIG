version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: agronavig-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-agronavig}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./agronavig-backend
    container_name: agronavig-backend
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-agronavig}
    ports:
      - "8000:8000"
    volumes:
      - ./agronavig-backend/models:/app/models
      - ./agronavig-backend/uploads:/app/uploads

  frontend:
    build: ./agronavig-frontend
    container_name: agronavig-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
